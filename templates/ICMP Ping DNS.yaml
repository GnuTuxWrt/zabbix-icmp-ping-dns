zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 813a9a315e4347a18636f3c0d771e17a
      template: 'ICMP Ping DNS'
      name: 'ICMP Ping DNS'
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: e985e2aa641e431ebfdd2acfb029444b
          name: net.dns.record.deduplicated
          type: CALCULATED
          key: net.dns.record.deduplicated
          value_type: TEXT
          trends: '0'
          params: 'concat(last(/{HOST.HOST}/net.dns.record[8.8.4.4,{HOST.HOST},A]),last(/{HOST.HOST}/net.dns.record[8.8.4.4,{HOST.HOST},AAAA]),last(/{HOST.HOST}/net.dns.record[2001:4860:4860::8844,{HOST.HOST},A]),last(/{HOST.HOST}/net.dns.record[2001:4860:4860::8844,{HOST.HOST},AAAA]),last(/{HOST.HOST}/net.dns.record[8.8.8.8,{HOST.HOST},A]),last(/{HOST.HOST}/net.dns.record[8.8.8.8,{HOST.HOST},AAAA]),last(/{HOST.HOST}/net.dns.record[2001:4860:4860::8888,{HOST.HOST},A]),last(/{HOST.HOST}/net.dns.record[2001:4860:4860::8888,{HOST.HOST},AAAA]))'
          preprocessing:
            - type: STR_REPLACE
              parameters:
                - '[]'
                - ''
            - type: STR_REPLACE
              parameters:
                - ']['
                - ','
            - type: JAVASCRIPT
              parameters:
                - 'var s={};return JSON.stringify(JSON.parse(value).filter(function(o){return!s[o.ip]&&(s[o.ip]=1);}));'
        - uuid: 96430d79d8dc425992a902146a485ff3
          name: primary4.ipv6
          key: 'net.dns.record[8.8.4.4,{HOST.HOST},AAAA]'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
            - type: JAVASCRIPT
              parameters:
                - 'var r=[];value.replace(/\b(?:A|AAAA)\s+([\da-f:.]+)/g,function(_,ip){r.push({ip:ip});});return JSON.stringify(r);'
        - uuid: 7d915a6eac7441bf9a63cea3a23c3e55
          name: primary4.ipv4
          key: 'net.dns.record[8.8.4.4,{HOST.HOST},A]'
